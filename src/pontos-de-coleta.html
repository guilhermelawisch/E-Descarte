<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/icons/favicon.ico" sizes="any" />
    <link href="./styles/output.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.css" integrity="sha256-AWTc12F4bU4GqRtfkaV/Tgn6ZxlRNjBJnTsXVNtP4XM=" crossorigin="anonymous">
    <script type="importmap">
      {
        "imports": {
          "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.js"
        },
        "integrity": {
          "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.4/dist/leaflet.js": "sha256-fRxwnl7F1oxlc3UchsWMQTaexLgt14hIMYKEjoeSdZ8="
        }
      }
    </script>
    <script type="module" defer>
      import {LeafletMap, TileLayer} from 'leaflet';

      const map = new LeafletMap('map').setView([-27.10475917660405, -52.61430791086622], 13);

      new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
    </script>
    <title>E-Descarte | PONTOS DE COLETA</title>
  </head>
  <body class="bg-background">
    <header class="header">
      <a href="./index.html">
        <div class="flex flex-row flex-auto">
          <img src="./assets/icons/lixeira.svg" alt="imagem lixeira" class="w-10 md:w-14"/>
          <h1 class="text-xl md:text-3xl font-bold items-center self-center">
            E-Descarte
          </h1>
        </div>
      </a>
      <div>
        <nav class="hidden md:block">
          <ul class="flex flex-row-reverse md:gap-2 xl:gap-6 items-end">
            <li class="hover:underline">
              <a href="./guias.html">GUIA DE DESCARTE</a>
            </li>
            <li class="hover:underline">
              <a href="./pontos-de-coleta.html">PONTOS DE COLETA</a>
            </li>
            <li class="hover:underline">
              <a href="./problema.html">PROBLEMA</a>
            </li>
          </ul>
        </nav>
        <div class="md:hidden text-end">
          <i class="fas fa-bars text-2xl"></i>
        </div>
      </div>
    </header>
    <main class="mx-20 my-10 flex flex-col gap-10">
      <section class="flex flex-col gap-4">
        <h2 class="text-4xl font-semibold">PONTOS DE COLETA</h2>
      </section>
      <section class="grid grid-cols-2 gap-10">
        <div class="flex flex-col gap-4">
          <div>
            <h4 class="text-2xl">SEU ELETRÔNICO TEM UM DESTINO CERTO</h4>
          </div>
          <div class="border rounded-md p-6 flex flex-col bg-background-card gap-4">
            <p class="text-xl">Onde você quer descartar?</p>
            <input type="text" name="" id="" class="border bg-background p-1 rounded-md">
            <button class="bg-green-dark rounded-md text-white py-1 font-semibold hover:cursor-pointer hover:bg-green-span border border-black">BUSCAR</button>
          </div>
          <div class="">
            <div class="flex flex-col gap-2">
              <p class="text-2xl">SELECIONE O TIPO DO MATERIAL</p>
              <label for="cel" class="hover:cursor-pointer">
                <input type="checkbox" name="cel" id="cel" class="mr-2 text-xl" checked>Celulares e Tablets
              </label>
              <label for="bat" class="hover:cursor-pointer">
                <input type="checkbox" name="bat" id="bat" class="mr-2 text-xl" checked>Baterias e Pilhas
              </label>
              <label for="com" class="hover:cursor-pointer">
                <input type="checkbox" name="com" id="com" class="mr-2 text-xl" checked>Computadores e Notebooks
            </label>
            </div>
          </div>
        </div>
        <div>
          <h4 class="hidden">LOCALIZAÇÃO NO MAPA</h4>
          <div id="map" class="w-full h-full"></div>
        </div>
      </section>
    </main>
    <footer
      class="footer"
    >
      <div>
        <p class="text-xs">
          &copy; 2026 David Fernandes Valentim & Guilherme Lawisch Machado.
          Todos os direitos reservados.​
        </p>
      </div>
    </footer>
  </body>
</html>
